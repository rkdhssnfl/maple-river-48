<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>센터 안내·일정</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
</head>
<body>
<style>
  html, body { margin: 0; } [hidden] { display: none !important; }
  body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  :root {
    --bg: #f3f5f2; --surface: #ffffff; --fg: #1d2a24; --muted: #65736c; --line: #d6ddd8;
    --accent: #1f6f5c; --accent-fg: #ffffff; --accent-soft: #dcefe8;
    --meet: #2e7d32; --meet-soft: #e6f4e8; --train: #1565c0; --train-soft: #e3eefb; --etc: #6d4c41; --etc-soft: #f3ece8;
    --no: #c62828; --no-soft: #fdeaea; --sun: #c62828; --sat: #1565c0; --today: #fff4cc;
    --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a17; --surface: #1d2622; --fg: #e8ede9; --muted: #98a59e; --line: #34403a;
      --accent: #5fc3a5; --accent-fg: #0d1a15; --accent-soft: #223b33;
      --meet: #66bb6a; --meet-soft: #1f3324; --train: #64b5f6; --train-soft: #1b2a3a; --etc: #bcaaa4; --etc-soft: #2c2523;
      --no: #ef5350; --no-soft: #3a2020; --sun: #ef5350; --sat: #64b5f6; --today: #3a3420;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141a17; --surface: #1d2622; --fg: #e8ede9; --muted: #98a59e; --line: #34403a;
    --accent: #5fc3a5; --accent-fg: #0d1a15; --accent-soft: #223b33;
    --meet: #66bb6a; --meet-soft: #1f3324; --train: #64b5f6; --train-soft: #1b2a3a; --etc: #bcaaa4; --etc-soft: #2c2523;
    --no: #ef5350; --no-soft: #3a2020; --sun: #ef5350; --sat: #64b5f6; --today: #3a3420;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); margin: 0 0 16px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  .top-inner { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .top h1 { font-size: 15px; margin: 0; font-weight: 700; }
  .top .sub { font-size: 12px; color: var(--muted); }
  .homebtn { flex: none; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; background: var(--surface); }
  .top a { font-size: 13px; color: var(--accent); font-weight: 700; text-decoration: none; white-space: nowrap; }
  .wrap { max-width: 560px; margin: 0 auto; padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  @media (min-width: 900px) {
    .wrap, .top-inner { max-width: 1180px; }
    .wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .empty { color: var(--muted); font-size: 13px; }

  /* 달력 */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-nav b { font-size: 18px; }
  .cal-nav button { font: inherit; font-size: 18px; width: 40px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
  .cal-nav .today-btn { width: auto; font-size: 13px; padding: 0 10px; margin-left: 6px; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .dow { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 2px 0 4px; }
  .dow.sun { color: var(--sun); } .dow.sat { color: var(--sat); }
  .day { min-height: 72px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 3px 4px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; cursor: default; min-width: 0; }
  .day.out { background: transparent; border-style: dashed; opacity: .45; }
  .day.has { cursor: pointer; }
  .day.today { background: var(--today); border-color: #e0b400; }
  .day.sel { outline: 2px solid var(--accent); outline-offset: -1px; }
  .day .n { font-size: 13px; font-weight: 700; line-height: 1.2; }
  .day.sun .n { color: var(--sun); } .day.sat .n { color: var(--sat); }
  .chip { display: block; font-size: 11px; line-height: 1.3; font-weight: 700; padding: 2px 4px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-meet { background: var(--meet-soft); color: var(--meet); } .t-train { background: var(--train-soft); color: var(--train); } .t-etc { background: var(--etc-soft); color: var(--etc); }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  @media (max-width: 400px) { .day { min-height: 62px; } .chip { font-size: 10px; padding: 1px 3px; } }

  /* 일정 목록 */
  .ev { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; scroll-margin-top: 80px; }
  .ev { transition: background .2s; }
  .ev.hl { border-left-width: 5px; padding-left: 8px; }
  .ev.hl.k-meet { background: var(--meet-soft); border-color: var(--meet); }
  .ev.hl.k-train { background: var(--train-soft); border-color: var(--train); }
  .ev.hl.k-etc { background: var(--etc-soft); border-color: var(--etc); }
  .ev.hl .dt, .ev.hl .em span { background: var(--surface); }
  .ev-h { display: flex; gap: 12px; align-items: flex-start; }
  .dt { flex: none; width: 56px; text-align: center; border-radius: 10px; padding: 5px 0; }
  .dt span { display: block; font-size: 11px; font-weight: 700; } .dt b { display: block; font-size: 22px; line-height: 1.1; }
  .et { font-weight: 700; font-size: 16px; }
  .em { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .em span { font-size: 15px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 3px 9px; line-height: 1.4; }
  .nb { white-space: pre-wrap; font-size: 14px; line-height: 1.6; margin-top: 6px; }
  .badge { font-size: 11px; font-weight: 700; color: #fff; background: var(--meet); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
  .rsvp { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  a.go { display: block; text-align: center; text-decoration: none; background: var(--meet); color: #fff; font-weight: 700; font-size: 16px; padding: 13px; border-radius: 10px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .sum { display: flex; gap: 6px; margin: 12px 0 6px; font-size: 13px; flex-wrap: wrap; }
  .sum span { padding: 3px 10px; border-radius: 999px; font-weight: 700; }
  .s-y { background: var(--meet-soft); color: var(--meet); } .s-n { background: var(--no-soft); color: var(--no); } .s-w { background: var(--bg); color: var(--muted); }
  table.st { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.st td { border: 1px solid var(--line); padding: 7px 9px; }
  table.st td.n { width: 45%; font-weight: 500; }
  td.y { background: var(--meet-soft); color: var(--meet); font-weight: 700; } td.x { background: var(--no-soft); color: var(--no); font-weight: 700; } td.w { color: var(--muted); }
  .memo { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }

  /* 안내사항 */
  :root { --nt: #b45309; --nt-soft: #fff7e6; --nt-line: #f2c97d; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --nt: #f6b35c; --nt-soft: #2f2617; --nt-line: #6b4f1f; } }
  :root[data-theme="dark"] { --nt: #f6b35c; --nt-soft: #2f2617; --nt-line: #6b4f1f; }
  :root { --cal-line: #8cc7b5; --list-line: #9cc0ea; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cal-line: #2f6b5a; --list-line: #2c4f75; } }
  :root[data-theme="dark"] { --cal-line: #2f6b5a; --list-line: #2c4f75; }
  .card.s-cal { border: 2px solid var(--cal-line); }
  .card.s-list { border: 2px solid var(--list-line); }
  .card.notice { border: 2px solid var(--nt-line); padding: 0; overflow: hidden; }
  .card.notice h2 { margin: 0; padding: 14px 14px 2px; color: var(--nt); font-size: 17px; justify-content: flex-start; }
  .card.notice h2 .cnt { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--nt); background: var(--nt-soft); border: 1px solid var(--nt-line); border-radius: 999px; padding: 1px 10px; }
  #notices { padding: 12px; display: grid; gap: 10px; }
  #notices .empty { padding: 4px 2px; }
  .nt { background: var(--nt-soft); border-left: 5px solid var(--nt); border-radius: 10px; padding: 12px 14px; }
  .nt.pinned { border-left-color: var(--no); background: var(--no-soft); }
  .nt-h { font-weight: 700; font-size: 17px; line-height: 1.45; }
  .pin { display: inline-block; font-size: 12px; font-weight: 700; color: #fff; background: var(--no); border-radius: 6px; padding: 1px 7px; margin-right: 6px; vertical-align: 2px; }
  .nd { display: inline-block; font-size: 12px; font-weight: 700; color: var(--nt); margin-top: 4px; }
  .nt .nb { font-size: 15px; line-height: 1.7; margin-top: 8px; color: var(--fg); }
  /* 배치: 휴대폰 = 안내 → 달력 → 일정, 컴퓨터 = 왼쪽 달력 / 오른쪽 안내·일정 */
  .s-cal { grid-area: cal; } .s-nt { grid-area: nt; } .s-list { grid-area: list; }
  @media (max-width: 899px) { .wrap { display: flex; flex-direction: column; } .s-nt { order: -1; } }
  @media (min-width: 900px) { .wrap { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); grid-template-areas: "cal list" "cal nt" "cal ."; grid-template-rows: auto auto 1fr; column-gap: 24px; row-gap: 0; } }
</style>

<header class="top">
  <div class="top-inner">
    <a class="homebtn" href="../coach.html" aria-label="홈 (센터 페이지 모음)">⌂ 홈</a>
    <div style="flex:1;min-width:0"><h1>센터 안내·일정</h1><div class="sub">경산기초학력거점지원센터 · 학습코칭단</div></div>
  </div>
</header>

<div class="wrap">
    <section class="card s-cal">
      <div class="cal-nav">
        <button type="button" id="prev" aria-label="이전 달">‹</button>
        <div><b id="ym"></b><button type="button" class="today-btn" id="toToday">오늘</button></div>
        <button type="button" id="next" aria-label="다음 달">›</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend"><span><i style="background:var(--meet)"></i>사례회의</span><span><i style="background:var(--train)"></i>제출</span><span><i style="background:var(--etc)"></i>기타</span><span><i style="background:var(--today);border:1px solid #e0b400"></i>오늘</span></div>
    </section>
    <section class="card s-list">
      <h2><span id="listTitle">이달 일정</span></h2>
      <div id="list"></div>
    </section>
    <section class="card notice s-nt">
      <h2>📢 센터 안내사항 <span class="cnt" id="ntCnt" hidden></span></h2>
      <div id="notices"></div>
    </section>
</div>

<script src="config.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const FORM = (window.CENTER_FORM || '').trim();
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const TYPE = { meet: '사례회의', train: '제출', etc: '기타' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const now = new Date(), TODAY = iso(now);
  let cy = now.getFullYear(), cm = now.getMonth(); // 보고 있는 달 (0~11)
  let selDay = '';
  let DATA = { notices: [], events: [] };
  const typeOf = e => e.type && TYPE[e.type] ? e.type : (e.rsvp ? 'meet' : 'etc');
  const sortKo = (a, b) => a.localeCompare(b, 'ko');

  function renderCal() {
    $('ym').textContent = cy + '년 ' + (cm + 1) + '월';
    const first = new Date(cy, cm, 1), start = new Date(cy, cm, 1 - first.getDay());
    const last = new Date(cy, cm + 1, 0);
    const weeks = Math.ceil((first.getDay() + last.getDate()) / 7);
    const byDay = {};
    (DATA.events || []).forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
    let h = DOW.map((d, i) => '<div class="dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + d + '</div>').join('');
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), k = iso(d);
      const evs = byDay[k] || [], out = d.getMonth() !== cm, w = d.getDay();
      const cls = ['day', out ? 'out' : '', w === 0 ? 'sun' : w === 6 ? 'sat' : '', k === TODAY ? 'today' : '', evs.length ? 'has' : '', k === selDay ? 'sel' : ''].filter(Boolean).join(' ');
      h += '<div class="' + cls + '" data-d="' + k + '"><span class="n">' + d.getDate() + '</span>' +
        evs.map(e => '<span class="chip t-' + typeOf(e) + '" title="' + esc(e.title) + '">' + esc(e.short || e.title) + '</span>').join('') + '</div>';
    }
    $('grid').innerHTML = h;
    $('grid').querySelectorAll('.day.has').forEach(el => el.addEventListener('click', () => {
      selDay = el.dataset.d; renderCal(); renderList();
      const t = document.querySelector('.ev[data-d="' + selDay + '"]'); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
  }

  function evHtml(e) {
    const [y, m, d] = e.date.split('-').map(Number), w = new Date(y, m - 1, d).getDay(), t = typeOf(e);
    let h = '<div class="ev k-' + t + (e.date === selDay ? ' hl' : '') + '" data-d="' + e.date + '"><div class="ev-h">' +
      '<div class="dt t-' + t + '"><span>' + m + '월</span><b>' + d + '</b><span>' + DOW[w] + '</span></div><div>' +
      '<div class="et">' + esc(e.title) + '' + '</div>' +
      ((e.time || e.place) ? '<div class="em">' + (e.time ? '<span>🕑 ' + esc(e.time) + '</span>' : '') + (e.place ? '<span>📍 ' + esc(e.place) + '</span>' : '') + '</div>' : '') +
      (e.note ? '<div class="nb">' + esc(e.note) + '</div>' : '') + '</div></div>';
    return h + '</div>';
  }

  // 참석·불참은 왈라 양식으로 받고, 이름별 현황은 센터가 응답을 정리해 올립니다(data.json).
  function rsvpHtml(e) {
    const form = e.form || FORM, st = e.status || {};
    const names = (e.roster || []).slice().sort(sortKo); Object.keys(st).forEach(n => { if (names.indexOf(n) < 0) names.push(n); });
    let y = 0, n = 0, w = 0; names.forEach(x => { const s = st[x] && st[x].s; if (s === '참석') y++; else if (s === '불참') n++; else w++; });
    let h = '<div class="rsvp">';
    if (form && e.date >= TODAY) h += '<a class="go" href="' + esc(form) + '" target="_blank" rel="noopener">참석·불참 응답하기 (왈라 양식 열기)</a><div class="hint">양식에서 이름과 참석 또는 불참을 골라 제출하면 끝이에요. 다시 내면 마지막 응답으로 정리돼요.</div>';
    if (names.length) {
      h += '<div class="sum"><span class="s-y">참석 ' + y + '</span><span class="s-n">불참 ' + n + '</span><span class="s-w">미응답 ' + w + '</span></div>';
      h += '<table class="st">' + names.map(x => { const r = st[x]; const c = !r ? 'w' : (r.s === '참석' ? 'y' : 'x'); return '<tr><td class="n">' + esc(x) + '</td><td class="' + c + '">' + (r ? esc(r.s) : '미응답') + (r && r.memo ? '<span class="memo">' + esc(r.memo) + '</span>' : '') + '</td></tr>'; }).join('') + '</table>';
      h += '<div class="hint">' + (e.statusAt ? esc(e.statusAt) + ' 기준 · ' : '') + '현황은 센터가 응답을 정리해 올릴 때 바뀌어요.</div>';
    }
    return h + '</div>';
  }

  function renderList() {
    const key = cy + '-' + String(cm + 1).padStart(2, '0');
    const evs = (DATA.events || []).filter(e => e.date.slice(0, 7) === key).sort((a, b) => a.date.localeCompare(b.date) || String(a.time || '').localeCompare(String(b.time || '')));
    $('listTitle').textContent = (cm + 1) + '월 일정';
    $('list').innerHTML = evs.length ? evs.map(evHtml).join('') : '<div class="empty">이 달에 등록된 일정이 없어요.</div>';
  }

  function renderNotices() {
    const ntDate = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v); return m ? (+m[2]) + '월 ' + (+m[3]) + '일 (' + DOW[new Date(+m[1], m[2] - 1, +m[3]).getDay()] + ')' : v; };
    const list = (DATA.notices || []).slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || String(b.date || '').localeCompare(String(a.date || '')));
    $('notices').innerHTML = list.length ? list.map(n => '<div class="nt' + (n.pinned ? ' pinned' : '') + '"><div class="nt-h">' + (n.pinned ? '<span class="pin">중요</span>' : '') + esc(n.title) + '</div>' +
      (n.date ? '<div class="nd">📅 ' + esc(ntDate(n.date)) + '</div>' : '') + '<div class="nb">' + esc(n.body) + '</div></div>').join('') : '<div class="empty">등록된 안내사항이 없어요.</div>';
    $('ntCnt').hidden = !list.length; $('ntCnt').textContent = list.length + '건';
  }

  const move = k => { cm += k; if (cm < 0) { cm = 11; cy--; } if (cm > 11) { cm = 0; cy++; } selDay = ''; renderCal(); renderList(); };
  $('prev').addEventListener('click', () => move(-1));
  $('next').addEventListener('click', () => move(1));
  $('toToday').addEventListener('click', () => { cy = now.getFullYear(); cm = now.getMonth(); selDay = ''; renderCal(); renderList(); });

  fetch('data.json?t=' + Date.now()).then(r => r.json()).then(d => { DATA = d || DATA; }).catch(() => {}).then(() => { renderCal(); renderList(); renderNotices(); });
})();
</script>
</body>
</html>
