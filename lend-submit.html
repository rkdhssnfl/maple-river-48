<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>교구·교재 대출 반납</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
</head>
<body>
<style>
  /* 레이아웃: 휴대폰 한 열. 대출/반납 선택 → 이름 → 관리번호 칩 추가 → 보내기 */
  html, body { margin: 0; } [hidden] { display: none !important; }
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --fg: #26231d; --muted: #6f6a60; --line: #ddd9d0;
    --accent: #8a5a1f; --accent-fg: #ffffff; --accent-soft: #f3e8d8; --input: #fffbe6;
    --lend: #b4542b; --ret: #2e7d32; --on: #ffffff; --err: #c62828;
    --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1816; --surface: #242019; --fg: #ece8e0; --muted: #a39d92; --line: #3d3830;
      --accent: #d9a35c; --accent-fg: #1a1410; --accent-soft: #3a2f22; --input: #2a2b1f;
      --lend: #e8936a; --ret: #66bb6a; --on: #15120e; --err: #ef5350; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1816; --surface: #242019; --fg: #ece8e0; --muted: #a39d92; --line: #3d3830;
    --accent: #d9a35c; --accent-fg: #1a1410; --accent-soft: #3a2f22; --input: #2a2b1f;
    --lend: #e8936a; --ret: #66bb6a; --on: #15120e; --err: #ef5350; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 520px; margin: 0 auto; padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 500; }
  .seg { display: flex; gap: 8px; }
  .seg button { flex: 1; font: inherit; font-size: 18px; font-weight: 700; padding: 16px 0; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
  .seg button[data-v="대출"][aria-pressed="true"] { background: var(--lend); border-color: var(--lend); color: var(--on); }
  .seg button[data-v="반납"][aria-pressed="true"] { background: var(--ret); border-color: var(--ret); color: var(--on); }
  input[type=text], input[type=tel] { font: inherit; font-size: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--input); color: var(--fg); width: 100%; }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .numrow { display: flex; gap: 8px; }
  .numrow input { flex: 1; letter-spacing: .15em; font-variant-numeric: tabular-nums; font-size: 22px; text-align: center; }
  .btn { font: inherit; font-size: 16px; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
  .btn.add { background: var(--accent-soft); font-weight: 700; white-space: nowrap; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; width: 100%; font-size: 18px; padding: 16px; }
  .btn.ghost { color: var(--muted); font-size: 13px; padding: 6px 10px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; min-height: 36px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 14px; border-radius: 999px; background: var(--accent-soft); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .08em; }
  .chip button { font: inherit; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 2px; }
  .small { font-size: 12px; color: var(--muted); }
  label.chk { display: flex; align-items: center; gap: 8px; font-size: 15px; margin-top: 10px; }
  .msg { margin-top: 12px; font-size: 15px; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); }
  .msg.ok { background: #e2efda; color: #1f4d22; font-weight: 700; }
  .msg.err { background: transparent; border: 1px solid var(--err); color: var(--err); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .msg.ok { background: #2f4a2f; color: #cfe8cf; } }
  .recent { font-size: 13px; color: var(--muted); margin-top: 8px; }
</style>

<div class="wrap">
  <h1>교구·교재 대출 반납</h1>
  <p class="sub">대출/반납을 고르고 이름과 관리번호(마지막 4자리)를 입력한 뒤 보내기를 누르세요. 바로 센터에 접수됩니다.</p>

  <section class="card">
    <h2>구분</h2>
    <div class="seg" role="group" aria-label="구분">
      <button type="button" data-v="대출" aria-pressed="false">대출</button>
      <button type="button" data-v="반납" aria-pressed="false">반납</button>
    </div>
  </section>

  <section class="card">
    <h2>이름</h2>
    <input type="text" id="name" placeholder="예) 박서연" autocomplete="name">
  </section>

  <section class="card">
    <h2>관리번호 (마지막 4자리)</h2>
    <div class="numrow">
      <input type="tel" id="num" inputmode="numeric" maxlength="40" placeholder="1237" autocomplete="off">
      <button class="btn add" id="add" type="button">추가</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="small">여러 개면 번호를 넣고 [추가]를 반복하세요. 잘못 넣은 번호는 × 로 지웁니다.</div>
    <label class="chk"><input type="checkbox" id="bad"> 파손·분실 등 이상이 있음</label>
    <input type="text" id="note" placeholder="이상 내용 (예: 모서리 파손)" hidden style="margin-top:8px">
  </section>

  <button class="btn primary" id="send" type="button">보내기</button>
  <div id="msg" hidden></div>
  <div class="recent" id="recent"></div>
</div>

<script>
(function () {
  const SUPABASE_URL = 'https://anrieakjjyiithncdnoi.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_yZ6fvQ7G0x9qz9BgGWAMmQ_s8sDIq_o';
  const $ = id => document.getElementById(id);
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const state = { type: '', nums: [] };
  try { $('name').value = localStorage.getItem('lend-name') || ''; } catch (e) {}

  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    state.type = b.dataset.v;
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('send').textContent = state.type + ' 보내기';
  }));
  $('bad').addEventListener('change', e => { $('note').hidden = !e.target.checked; });

  function renderChips() {
    $('chips').innerHTML = state.nums.map((n, i) => '<span class="chip">' + esc(n) + '<button type="button" aria-label="삭제" data-i="' + i + '">×</button></span>').join('');
    $('chips').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { state.nums.splice(Number(b.dataset.i), 1); renderChips(); }));
  }
  function addNum() {
    const raw = $('num').value.trim();
    const parts = raw.split(/[,，\s\/·;]+/).map(x => x.replace(/[^0-9A-Za-z-]/g, '')).filter(Boolean);
    if (!parts.length) { $('num').focus(); return; }
    parts.forEach(p => { const n = p.length > 4 ? p.slice(-4) : p; if (!state.nums.includes(n)) state.nums.push(n); });
    $('num').value = ''; renderChips(); $('num').focus();
  }
  $('add').addEventListener('click', addNum);
  $('num').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addNum(); } });

  const msg = $('msg');
  function showMsg(t, cls) { msg.hidden = false; msg.className = 'msg' + (cls ? ' ' + cls : ''); msg.textContent = t; }

  async function rpc(fn, body) {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
      body: JSON.stringify(body),
    });
    const text = await res.text();
    if (!res.ok) { let m = text; try { m = JSON.parse(text).message || text; } catch (e) {} throw new Error(m); }
    return text ? JSON.parse(text) : null;
  }

  $('send').addEventListener('click', async () => {
    const name = $('name').value.trim();
    if ($('num').value.trim()) addNum();
    const errs = [];
    if (!state.type) errs.push('대출 또는 반납을 선택하세요.');
    if (!name) errs.push('이름을 입력하세요.');
    if (!state.nums.length) errs.push('관리번호를 넣고 [추가]를 누르세요.');
    if (errs.length) { showMsg(errs.join(' '), 'err'); return; }
    const btn = $('send'); btn.disabled = true; btn.textContent = '보내는 중...';
    try {
      const cnt = await rpc('lend_submit', { p_type: state.type, p_name: name, p_nums: state.nums, p_status: $('bad').checked ? '이상' : '양호', p_note: $('bad').checked ? $('note').value.trim() : '' });
      try { localStorage.setItem('lend-name', name); } catch (e) {}
      const now = new Date();
      showMsg('접수되었습니다. ' + state.type + ' ' + state.nums.join(', ') + ' (' + cnt + '건, ' + (now.getMonth() + 1) + '/' + now.getDate() + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ')', 'ok');
      $('recent').textContent = '방금 보낸 것: [' + state.type + '] ' + name + ' ' + state.nums.join(', ');
      state.nums = []; renderChips(); $('bad').checked = false; $('note').value = ''; $('note').hidden = true;
    } catch (e) {
      showMsg('보내지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요. (' + ((e && e.message) || '오류') + ')', 'err');
    } finally { btn.disabled = false; btn.textContent = state.type ? state.type + ' 보내기' : '보내기'; }
  });
})();
</script>
</body>
</html>
