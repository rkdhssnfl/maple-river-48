<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elementary English Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 레이아웃: 왼쪽 정렬 880px 한 단. 학년 탭 → 단원 카드 → 개념 카드 + 게임.
     영어 낱말은 4선 공책 줄 위에 놓는다. 한 가지(밝은) 테마만 쓴다. */
  color-scheme: light;
  --paper:#f2f6fd;
  --card:#ffffff;
  --ink:#1b2850;
  --ink-soft:#56628a;
  --line:#cfd9ee;
  --sun:#ffc531;
  --good:#0d8a5c;
  --bad:#d63a40;
  --gc:#e2532b;          /* 학년 색: 스크립트가 학년마다 바꾼다 */
  --gc-soft:#ffe9e1;
  --f-display:'Jua','Noto Sans KR','Malgun Gothic',sans-serif;
  --f-body:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --f-en:'Andika','Comic Sans MS','Trebuchet MS',var(--f-body);
}
:root[data-g="1"]{--gc:#0a7c93;--gc-soft:#d9f1f6}
:root[data-g="2"]{--gc:#b23a7f;--gc-soft:#fbe3f1}
:root[data-g="4"]{--gc:#0d8a5c;--gc-soft:#dcf5ea}
:root[data-g="5"]{--gc:#2b6be6;--gc-soft:#e0ebff}
:root[data-g="6"]{--gc:#7a4be0;--gc-soft:#ece4ff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 56px}
.en{font-family:var(--f-en)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}

/* 머리 */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
.top h1{font-size:34px;line-height:1.1}
.top h1{font-family:var(--f-en);font-weight:700}
.top h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:15px;color:var(--ink-soft);letter-spacing:.04em;margin-bottom:4px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-family:var(--f-display);font-size:17px;padding:6px 14px;text-decoration:none;color:inherit;border-radius:999px;border:2px solid var(--ink);background:var(--card)}
.tab[aria-current="page"]{background:var(--gc);border-color:var(--gc);color:#fff}

.snd{display:flex;gap:8px;flex-wrap:wrap;flex-basis:100%}
.snd button{font-size:14px;font-weight:700;padding:4px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink-soft)}
.snd select{font:inherit;font-size:14px;font-weight:700;padding:4px 8px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.snd .vl{font-size:14px;font-weight:700;align-self:center;color:var(--ink-soft)}
.snd #sndMsg{font-size:13px;color:var(--ink-soft);align-self:center}
.snd button[aria-pressed="true"]{border-color:var(--ink);background:var(--sun);color:var(--ink)}
/* 과정 화면 */
.cont{display:grid;gap:2px;text-align:left;width:100%;padding:16px 20px;margin:0 0 22px;border-radius:18px;border:2px solid var(--ink);border-bottom-width:6px;background:var(--sun)}
.cont span{font-size:14px;font-weight:700}
.cont b{font-family:var(--f-display);font-weight:400;font-size:23px;line-height:1.3}
.cont.fin{font-family:var(--f-display);font-size:22px}
.path{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:10px}
.stage{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;padding:14px 16px;background:var(--card);border:2px solid var(--line);border-left:8px solid var(--gc);border-radius:14px;text-decoration:none;color:inherit}
.stage:hover{border-color:var(--gc)}
.stage .no{grid-row:span 2;font-family:var(--f-display);font-size:22px;width:44px;height:44px;border-radius:50%;background:var(--gc);color:#fff;display:grid;place-items:center}
.stage .sn{font-family:var(--f-display);font-size:21px}
.stage .sd{grid-column:2/4;color:var(--ink-soft);font-size:15px}
.stage .bar{grid-column:1/4;height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.stage .bar i{display:block;height:100%;background:var(--gc)}
.stage .st{grid-column:1/4;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pill{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--paper);color:var(--ink-soft);border:1px solid var(--line)}
.pill.on{background:var(--gc-soft);color:var(--gc);border-color:var(--gc)}
.pill.ok{background:var(--good);color:#fff;border-color:var(--good)}
.unit.now,.gbtn.now{border-color:var(--ink);box-shadow:0 0 0 3px var(--sun)}
.unit.ok .no{background:var(--good)}
.unit.ok,.gbtn.ok{border-color:var(--good)}
.gbtn .num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gc);color:#fff;font-size:16px;margin-right:8px}
.gbtn.ok .num{background:var(--good)}
.gbtn em{font-style:normal;font-size:13px;font-weight:700;letter-spacing:0;color:var(--ink-soft);margin-left:6px}
a.back{display:inline-block;text-decoration:none}
.pic{width:1.7em;height:1.28em;vertical-align:middle}
.sent .spic{font-style:normal;font-size:44px;line-height:1;flex:none}
.sent .spic .pic{width:1.9em;height:1.43em}
.q .big .pic{width:3.4em;height:2.55em}
.word>i .pic{width:2.6em;height:1.95em}
.sents.gal{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.sents.gal .sent{flex-direction:column;align-items:flex-start;padding:14px;gap:4px}
.sents.gal .spic{font-size:60px;align-self:center}
.sents.gal .spic .pic{width:2.8em;height:2.1em}
.mc .face .pic{width:2.4em;height:1.8em}
.ovc .em{width:100%}
.ovc .em .pic{width:min(100%,400px);height:auto}
.rot{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;width:min(100%,400px)}
.rot input{flex:1;accent-color:var(--gc)}
.choice .pic{width:2.4em;height:1.8em;display:block;margin:0 auto 4px}
.form{display:grid;gap:6px;max-width:520px}
.form label{font-weight:700;font-size:14px;margin-top:8px}
.form input,.form textarea{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.form textarea{font-family:var(--f-en),var(--f-body);line-height:1.6;resize:vertical}
.form input:focus,.form textarea:focus{outline:3px solid var(--ink);outline-offset:1px}
.dels{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px 14px}
.dels .skip{margin:0;font-size:14px}
/* 학년 화면 */
.lead{margin:6px 0 18px;color:var(--ink-soft);max-width:60ch}
.gh{font-size:26px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.unit{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;padding:16px;background:var(--card);border:2px solid var(--line);border-radius:16px;border-bottom-width:5px}
.unit:hover{border-color:var(--gc)}
.unit .no{grid-row:span 3;font-family:var(--f-display);font-size:22px;width:44px;height:44px;border-radius:50%;background:var(--gc);color:#fff;display:grid;place-items:center}
.unit .ut{font-family:var(--f-display);font-size:20px;line-height:1.3}
.unit .uk{color:var(--ink-soft);font-size:15px;line-height:1.4}
.unit .st{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.star{color:var(--sun)} .star.off{color:var(--line)}

/* 단원 화면 */
.back{background:none;border:0;padding:6px 0;color:var(--ink-soft);font-weight:500}
.back:hover{color:var(--ink)}
.concept{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;margin:10px 0 22px}
.concept h2{font-size:28px;margin-bottom:12px}
.label{display:inline-block;font-size:13px;font-weight:700;color:var(--gc);background:var(--gc-soft);padding:2px 10px;border-radius:999px;margin-bottom:8px}
.keys{display:grid;gap:8px;margin-bottom:14px}
.key{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
/* 영어 4선 공책: 위에서 셋째 줄(기준선)만 붉게 */
.lined{background-image:
  linear-gradient(to bottom,transparent 17%,var(--line) 17%,var(--line) calc(17% + 1px),transparent calc(17% + 1px),
  transparent 39%,var(--line) 39%,var(--line) calc(39% + 1px),transparent calc(39% + 1px),
  transparent 63%,#f0a39a 63%,#f0a39a calc(63% + 2px),transparent calc(63% + 2px),
  transparent 85%,var(--line) 85%,var(--line) calc(85% + 1px),transparent calc(85% + 1px))}
.key .lined{font-family:var(--f-en);font-size:24px;font-weight:700;padding:6px 14px;flex:1 1 260px;border-radius:8px;overflow-wrap:anywhere}
.say{flex:none;border:2px solid var(--ink);background:var(--sun);border-radius:999px;padding:4px 14px;font-size:14px;font-weight:700}
.tip{margin:0 0 16px;max-width:62ch}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 12px;text-align:left}
.word:hover{border-color:var(--gc)}
.word b{font-family:var(--f-en);font-size:18px}
.word span{font-size:14px;color:var(--ink-soft)}
.word i{font-style:normal;font-size:20px}
.lrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 8px}
.lrow .label{margin:0}
.concept .tip+.lrow{margin-top:0}
.sents{display:grid;gap:8px}
.sent{flex-wrap:wrap;gap:2px 12px}
.choices.long{grid-template-columns:1fr}
.choices.long .choice{font-size:20px;padding:12px}
.fb .note{font-weight:500;color:var(--ink-soft)}
.fb .donebox{justify-content:center;margin:0 0 12px}
.fb .donebox .lined{flex:0 1 auto;font-size:28px}
.ov{position:fixed;inset:0;background:rgba(27,40,80,.5);display:grid;place-items:center;padding:16px;z-index:10}
.ovc{background:var(--card);border-radius:20px;padding:28px 22px;max-width:600px;width:100%;text-align:center;display:grid;gap:14px;justify-items:center;border:3px solid var(--gc)}
.ovc .em{font-size:64px;line-height:1.1;font-weight:700}
.ovc .lined{font-family:var(--f-en);font-weight:700;font-size:clamp(28px,7vw,54px);line-height:1.5;padding:8px 20px;border-radius:10px;overflow-wrap:anywhere;width:100%}
.ovc p{margin:0;font-size:20px;color:var(--ink-soft)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gbtn{text-align:left;padding:16px;border-radius:16px;border:2px solid var(--gc);border-bottom-width:5px;background:var(--card);display:grid;gap:2px}
.gbtn:hover{background:var(--gc-soft)}
.gbtn b{font-family:var(--f-display);font-weight:400;font-size:21px}
.gbtn span{font-size:14px;color:var(--ink-soft)}
.gbtn .st{font-size:18px;letter-spacing:2px}
.sub{font-size:22px;margin:0 0 10px}

/* 게임 화면 */
.gbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.gbar .gt{font-family:var(--f-display);font-size:20px}
.gbar .gp{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gc)}
.prog{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 20px}
.prog i{display:block;height:100%;background:var(--gc);border-radius:999px;transition:width .3s}
.q{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center;margin-bottom:16px}
.q .big{font-size:64px;line-height:1.15;font-family:var(--f-en);font-weight:700}
.q .qt{font-size:22px;font-weight:500;overflow-wrap:anywhere}
.q .qt.en{font-size:26px;font-weight:700}
.q .hint{font-size:15px;color:var(--ink-soft);margin-top:4px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choice{padding:16px 10px;font-size:24px;font-weight:700;background:var(--card);border:2px solid var(--ink);border-bottom-width:5px;border-radius:14px;overflow-wrap:anywhere}
.choice:hover:not(:disabled){background:var(--gc-soft)}
.choice.ok{background:var(--good);border-color:var(--good);color:#fff}
.choice.no{background:#fde8e8;border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.choice:disabled{cursor:default}
.fb{min-height:96px;margin-top:16px;text-align:center}
.fb p{margin:0 0 10px;font-weight:700;font-size:18px}
.fb .good{color:var(--good)} .fb .bad{color:var(--bad)}
.next,.btn{font-family:var(--f-display);font-size:20px;padding:10px 26px;border-radius:999px;border:2px solid var(--ink);background:var(--sun)}
.btn.plain{background:var(--card)}
.answer{min-height:74px;border:2px dashed var(--gc);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;background-color:var(--card);margin-bottom:14px}
.answer.done{border-style:solid;border-color:var(--good)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:58px}
.tile{font-family:var(--f-en);font-size:24px;font-weight:700;padding:8px 16px;min-width:48px;border-radius:12px;border:2px solid var(--ink);border-bottom-width:5px;background:var(--card)}
.answer .tile{background:var(--gc-soft)}
.answer.done .tile{background:var(--good);border-color:var(--good);color:#fff}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:1/1;min-height:84px;border-radius:14px;border:2px solid var(--ink);border-bottom-width:5px;background:var(--gc);color:#fff;font-family:var(--f-display);font-size:30px;padding:4px;display:grid;place-items:center;overflow:hidden}
.mc .face{display:none;text-align:center;line-height:1.25;overflow-wrap:anywhere}
.mc .face b{font-family:var(--f-en);font-size:clamp(15px,3.6vw,24px)}
.mc .face i{font-style:normal;display:block;font-size:clamp(20px,5vw,32px);font-family:var(--f-en)}
.mc .face span{font-family:var(--f-body);font-size:clamp(12px,2.6vw,15px);font-weight:500}
.mc.open,.mc.done{background:var(--card);color:var(--ink)}
.mc.open .face,.mc.done .face{display:block}
.mc.open .qm,.mc.done .qm{display:none}
.mc.done{border-color:var(--good);background:#e4f6ee}
.pad{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;overflow:hidden;aspect-ratio:2/1;margin-bottom:14px}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
#dr{touch-action:none;cursor:crosshair}
.q .say{font-size:20px;padding:10px 26px;margin-top:12px}
.skip{background:none;border:0;text-decoration:underline;color:var(--ink-soft);margin-left:10px}
.result{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:32px 18px;text-align:center}
.result .st{font-size:56px;letter-spacing:6px;line-height:1.2}
.result h2{font-size:28px;margin:6px 0}
.result p{margin:0 0 20px;color:var(--ink-soft)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
footer{margin-top:36px;font-size:13px;color:var(--ink-soft);max-width:70ch}
@media (max-width:420px){.top h1{font-size:28px}.q .big{font-size:52px}.choice{font-size:20px}.tile{font-size:20px;padding:6px 12px}.mgrid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><small>초등 영어 놀이터</small>Elementary English Playground</h1>
    <nav class="tabs" id="tabs" aria-label="학년 고르기"></nav>
    <div class="snd" id="snd" aria-label="소리 설정"></div>
  </header>
  <main id="app"></main>
  <footer>알파벳, 파닉스, 사이트 워드는 영어를 처음 읽고 쓰는 데 필요한 기초이고, 3~6학년 표현은 2022 개정 영어과 교육과정의 학년군별 의사소통 기능과 기본 어휘를 바탕으로 엮었습니다. 교과서는 출판사마다 단원 순서가 다릅니다. 어휘 탭의 낱말은 초등 수준의 기초 낱말을 주제별로 고른 것이며, 교과서 낱말은 내 낱말 탭에 직접 넣어 씁니다. 따라 쓰기는 글자 모양만 확인하고 획순은 확인하지 않습니다. 별과 진행 기록은 이 기기에만 저장됩니다.</footer>
</div>
<script>
/* 단원 자료: t 제목, k 핵심 표현, tip 개념 설명, w [영어, 뜻, 그림], s [문장, 뜻], f [문제, 정답, [오답], 도움말] */
const G={
1:{lead:'알파벳 26글자의 이름과 모양을 익히고 네 줄 공책에 따라 써요.',units:[
{t:'알파벳 A~M 쓰기',letters:'ABCDEFGHIJKLM',k:['A a  B b  C c  D d','E e  F f  G g  H h','I i  J j  K k  L l  M m'],tip:'알파벳은 네 줄 공책에 써요. 대문자는 첫째 줄부터 붉은 셋째 줄까지 닿게 써요. 소문자 a, c, e는 둘째 줄과 셋째 줄 사이에 쓰고, b, d, h, k, l은 첫째 줄까지 올라가요. g와 j는 넷째 줄까지 내려가요.',
 s:[['A B C D E F G','대문자를 순서대로 놓아요 (A부터)'],['H I J K L M','대문자를 순서대로 놓아요 (H부터)'],['a b c d e f g','소문자를 순서대로 놓아요 (a부터)'],['h i j k l m','소문자를 순서대로 놓아요 (h부터)']],
 f:[['대문자 B의 소문자는 ___','b',['d','p','q']],['소문자 g의 대문자는 ___','G',['C','Q','J']],['A B C ___ E','D',['F','G','B']],['i j k ___ m','l',['n','h','t']],['넷째 줄까지 내려가는 소문자는 ___','g',['a','d','h']]]},

/* 전치사 그림: 바닥 위에 상자, 공, 사람, 건물 같은 물체를 3차원 좌표로 놓고 비스듬히 내려다본 모습으로 그린다.
   x는 오른쪽, y는 보는 사람에게서 멀어지는 쪽, z는 위. yaw만큼 돌려서 볼 수 있다. */
const R3=(()=>{
  const PH=32*Math.PI/180,CP=Math.cos(PH),SP=Math.sin(PH),S=29,CX=100,CY=103,INK='#1b2850';
  const LIGHT=[-.42,-.56,.71];
  const TAN=[227,173,114],DARK=[150,104,58],BLUE=[70,120,230],CREAM=[244,226,196],ROOF=[205,84,60],STEP=[200,210,232],WOOD=[196,140,86],
        WHITE=[250,250,255],RED=[226,83,43],PINK=[236,120,170],NAVY=[52,64,110],YEL=[250,200,60],GREEN=[110,180,110],GLASS=[170,210,245],GRAY=[214,220,232];
  const BC={red:['#ff9d7c','#c93a17'],skin:['#ffe0bd','#e0a878'],hair:['#7a5634','#3a2413'],black:['#5a6178','#232a3d'],orange:['#ffc98a','#e2801f'],
            white:['#ffffff','#c9d1e3'],yellow:['#fff3a8','#f0b41c'],green:['#9bdc86','#3d9638'],brown:['#c9925e','#7d4f27'],gray:['#c5cbdb','#7c869f']};
  function draw(name,yaw){
    const t=yaw*Math.PI/180,c=Math.cos(t),s=Math.sin(t);
    const rot=p=>[p[0]*c-p[1]*s,p[0]*s+p[1]*c,p[2]];
    const pr=p=>{const q=rot(p);return[(CX+q[0]*S).toFixed(1),(CY-(q[2]*CP+q[1]*SP)*S).toFixed(1)]};
    const dep=p=>{const q=rot(p);return q[1]*CP-q[2]*SP};
    const items=[],defs=[];let floorCol='#e6ecf8';
    /* o: L 층, bias 깊이 보정, ref 깊이 기준점, op 투명도 */
    const face=(pts,n,col,o={})=>{
      const r=rot(n);if(-r[1]*CP+r[2]*SP<=0.001)return;
      const f=.6+.4*Math.max(0,n[0]*LIGHT[0]+n[1]*LIGHT[1]+n[2]*LIGHT[2]);
      const ctr=o.ref||pts.reduce((a,p)=>[a[0]+p[0]/pts.length,a[1]+p[1]/pts.length,a[2]+p[2]/pts.length],[0,0,0]);
      items.push({L:o.L==null?1:o.L,d:dep(ctr)+(o.bias||0),svg:`<polygon points="${pts.map(p=>pr(p).join(',')).join(' ')}" fill="rgb(${col.map(v=>Math.round(v*f)).join(',')})"${o.op?` fill-opacity="${o.op}"`:''} stroke="${INK}" stroke-width="${o.thin?.8:1.4}" stroke-linejoin="round"/>`});
    };
    const box=(x0,y0,z0,x1,y1,z1,col,o={})=>{
      const F=[[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],[[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]],[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]];
      const N=[[0,-1,0],[0,1,0],[-1,0,0],[1,0,0]],L=o.L==null?1:o.L;
      F.forEach((q,k)=>{face(q,N[k],col,{L:o.open?2:L,op:o.op});if(o.open)face(q,N[k].map(v=>-v),o.inner||DARK,{L:0,op:o.op})});
      if(o.open)face([[x0,y0,z0+.03],[x1,y0,z0+.03],[x1,y1,z0+.03],[x0,y1,z0+.03]],[0,0,1],o.inner||DARK,{L:0,bias:5});
      else face([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],[0,0,1],col,{L,op:o.op});
    };
    const cube=(x,y,open)=>box(x-.55,y-.55,0,x+.55,y+.55,1.1,TAN,{open});
    const ball=(x,y,z,o={})=>{
      const r=o.r||.4,cn=o.c||'red',id='g'+name+cn,P=pr([x,y,z]);
      if(!defs.some(d=>d.includes('"'+id+'"')))defs.push(`<radialGradient id="${id}" cx=".34" cy=".3" r=".8"><stop offset="0" stop-color="${BC[cn][0]}"/><stop offset="1" stop-color="${BC[cn][1]}"/></radialGradient>`);
      if(o.shadow!==false){const z0=o.on||0,Q=pr([x,y,z0]),k=z-z0>r+.1?.8:1;
        items.push({L:z0?(o.L||1):-1,d:dep([x,y,z])+.02,svg:`<ellipse cx="${Q[0]}" cy="${Q[1]}" rx="${(r*S*k).toFixed(1)}" ry="${(r*S*SP*k).toFixed(1)}" fill="#1b2850" opacity=".2"/>`})}
      items.push({L:o.L||1,d:dep([x,y,z])+(o.bias||0),svg:`<circle cx="${P[0]}" cy="${P[1]}" r="${(r*S).toFixed(1)}" fill="url(#${id})" stroke="${INK}" stroke-width="${r<.15?.8:1.4}"/>`});
    };
    const arrow=(a,b,L)=>{const A=pr(a).map(Number),B=pr(b).map(Number),g=Math.atan2(B[1]-A[1],B[0]-A[0]),q=d=>`${(B[0]-11*Math.cos(g+d)).toFixed(1)},${(B[1]-11*Math.sin(g+d)).toFixed(1)}`;
      items.push({L,d:0,svg:`<path d="M${A[0]} ${A[1]}L${B[0]} ${B[1]}" stroke="#2b6be6" stroke-width="4.5" stroke-linecap="round"/><polygon points="${B[0]},${B[1]} ${q(.5)} ${q(-.5)}" fill="#2b6be6" stroke="#2b6be6" stroke-width="3" stroke-linejoin="round"/>`})};
    const text=(p,str,size,ref)=>{const P=pr(p);items.push({L:1,d:dep(ref||p)-.04,svg:`<text x="${P[0]}" y="${P[1]}" text-anchor="middle" dominant-baseline="middle" font-size="${size}" font-weight="700" font-family="Arial, sans-serif" fill="${INK}">${str}</text>`})};
    const line=(a,b,w,ref)=>{const A=pr(a),B=pr(b);items.push({L:1,d:dep(ref)-.04,svg:`<path d="M${A[0]} ${A[1]}L${B[0]} ${B[1]}" stroke="${INK}" stroke-width="${w}" stroke-linecap="round"/>`})};
    /* 앞을 향한 면(y 고정)에 붙이는 네모와 동그라미 */
    const deco=(x0,z0,x1,z1,y,col,ref)=>face([[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]],[0,-1,0],col,{ref,bias:-.02,thin:true});
    const discY=(x,y,z,r,col,ref,b)=>face(Array.from({length:16},(_,k)=>[x+r*Math.cos(k*Math.PI/8),y,z+r*Math.sin(k*Math.PI/8)]),[0,-1,0],col,{ref,bias:b,thin:true});
    const discZ=(x,y,z,r,col)=>face(Array.from({length:16},(_,k)=>[x+r*Math.cos(k*Math.PI/8),y+r*Math.sin(k*Math.PI/8),z]),[0,0,1],col,{thin:true});
    /* 사람: 다리, 몸, 머리, 머리카락. z0가 있으면 그 높이에 앉은 모습 */
    const kid=(x,y,o={})=>{const z=o.z0||0;
      if(z)box(x-.17,y-.42,z,x+.17,y,z+.15,NAVY);else box(x-.17,y-.1,0,x+.17,y+.1,.38,NAVY);
      const b=z?z+.15:.38;box(x-.21,y-.13,b,x+.21,y+.13,b+.5,o.shirt||BLUE);
      ball(x,y+.08,b+.8,{r:.27,c:o.hair||'hair',shadow:false});
      if(o.long)box(x-.2,y+.1,b+.3,x+.2,y+.22,b+.75,[90,60,34]);
      ball(x,y-.02,b+.74,{r:.25,c:'skin',shadow:!z});
    };
    const person=(x,y)=>kid(x,y);
    const tree=(x,y)=>{box(x-.09,y-.09,0,x+.09,y+.09,.7,DARK);ball(x,y,1.1,{r:.5,c:'green'});ball(x+.25,y-.1,.9,{r:.3,c:'green',shadow:false})};
    const build=(x,y,w,dd,hh,col,label)=>{const f=y-dd/2,ref=[x,f,hh/2];box(x-w/2,f,0,x+w/2,y+dd/2,hh,col);box(x-w/2-.06,f-.06,hh,x+w/2+.06,y+dd/2+.06,hh+.1,ROOF);

      choices:shuffle([lab(w),...pick(u.w.filter(x=>x[1]!==w[1]).map(lab),3)])})))}

const shell=(title,i,n,body)=>`<div class="gbar"><button class="back" id="quit">← 그만하기</button><span class="gt">${title}</span><span class="gp">${Math.min(i+1,n)} / ${n}</span></div><div class="prog"><i style="width:${i/n*100}%"></i></div>${body}`;
const qbox=q=>`<div class="q">${q.big?`<div class="big">${q.big}</div>`:''}<div class="qt${q.en?' en':''}">${q.text}</div></div>`;
const bindQuit=()=>{$('#quit').onclick=()=>CTX.back()};

function runQuiz(id,title,qs){
  let i=0,score=0;
  const show=()=>{
    const q=qs[i];let first=true;
    app.innerHTML=shell(title,i,qs.length,(q.listen?`<div class="q"><div class="qt">소리를 듣고 알맞은 것을 골라요.</div><button class="say" id="re">다시 듣기</button></div>`:qbox(q))+`<div class="choices${q.long?' long':''}">${q.choices.map((c,k)=>`<button class="choice en" data-k="${k}">${c}</button>`).join('')}</div><div class="fb" aria-live="polite"></div>`);
    bindQuit();
    if(q.listen){speak(q.hear||q.answer);$('#re').onclick=()=>speak(q.hear||q.answer)}
    app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      if(q.choices[+b.dataset.k]===q.answer){
        if(first)score++;fx('ok');
        b.classList.add('ok');app.querySelectorAll('.choice').forEach(x=>x.disabled=true);
        if(q.say&&!q.hear)speak(q.say);
        $('.fb').innerHTML=`<p class="good">${first?'정답이에요!':'맞았어요!'}${q.tip?' '+q.tip+'.':''}</p>${doneBox(q.say||(q.listen?q.answer:''))}${q.note?`<p class="note">${q.note}</p>`:''}<button class="next">${i+1<qs.length?'다음 문제':'결과 보기'}</button>`;
        bindSay($('.fb'));
        $('.next').onclick=()=>{i++;i<qs.length?show():finish(id,score,qs.length)};$('.next').focus();
      }else{first=false;fx('no');b.classList.add('no');b.disabled=true;const c=q.choices[+b.dataset.k];
        $('.fb').innerHTML='<p class="bad">아쉬워요. 다시 골라 보세요.</p>'+(q.sc?doneBox(c):'');
        if(q.sc){speak(c);bindSay($('.fb'))}}
    });
  };
  show();
}
function runBuild(id,title,items){
  let i=0,score=0;
  const show=()=>{
    const it=items[i];let first=true,done=false,ans=[],msg='';
    let pool=shuffle(it.tokens.map((t,k)=>({t,k})));
    if(it.tokens.length>1){let n=0;while(pool.map(x=>x.t).join('|')===it.tokens.join('|')&&n++<20)pool=shuffle(pool)}
    const tile=(x,w)=>`<button class="tile" data-w="${w}" data-k="${x.k}" ${done?'disabled':''}>${x.t}</button>`;
    const draw=shake=>{
      app.innerHTML=shell(title,i,items.length,qbox(it)+`<div class="answer${done?' done':''}${shake?' shake':''}" aria-label="내가 만든 답">${ans.map(x=>tile(x,'a')).join('')}</div><div class="pool">${pool.map(x=>tile(x,'p')).join('')}</div><div class="fb" aria-live="polite">${msg}</div>`);
      bindQuit();
      if(done){bindSay($('.fb'));$('.next').onclick=()=>{i++;i<items.length?show():finish(id,score,items.length)};$('.next').focus();return}
      app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
        const k=+b.dataset.k;fx('tap');
        if(b.dataset.w==='p'){ans.push(pool.find(x=>x.k===k));pool=pool.filter(x=>x.k!==k)}
        else{pool.push(ans.find(x=>x.k===k));ans=ans.filter(x=>x.k!==k)}
        msg='';
        if(!pool.length){
          if(ans.map(x=>x.t).join(it.sep)===it.tokens.join(it.sep)){
            done=true;if(first)score++;fx('ok');speak(it.say);
            msg=`<p class="good">${first?'정답이에요!':'완성했어요!'}</p>${doneBox(it.say)}<button class="next">${i+1<items.length?'다음 문제':'결과 보기'}</button>`;
          }else{
            first=false;fx('no');let j=0;while(ans[j].t===it.tokens[j])j++;
            pool=ans.slice(j);ans=ans.slice(0,j);
            msg=`<p class="bad">${j?'앞쪽은 맞았어요. 나머지를 다시 놓아 보세요.':'처음부터 다시 놓아 보세요.'}</p>`;
            return draw(true);
          }
        }
        draw();
      });
    };
    draw();
  };
  show();
}
function runWrite(id,title,items,noun){
  let i=0,score=0;
  const W=640,H=320;
  const show=async()=>{
    const it=items[i],txt=it.txt;let first=true,strokes=[],cur=null,done=false;
    app.innerHTML=shell(title,i,items.length,`<div class="q"><div class="qt">흐린 ${noun} <b class="en">${txt}</b>${it.ko?' ('+it.ko+')':''} 위를 손가락이나 마우스로 따라 써요.</div></div><div class="pad"><canvas id="gd" width="${W}" height="${H}"></canvas><canvas id="dr" width="${W}" height="${H}" aria-label="${txt} 따라 쓰는 칸"></canvas></div><div class="row">${canSpeak?'<button class="btn plain" id="hear">듣기</button>':''}<button class="btn plain" id="clr">지우기</button><button class="btn" id="chk">다 썼어요</button></div><div class="fb" aria-live="polite"></div>`);
    bindQuit();
    const dr=$('#dr'),g=$('#gd').getContext('2d'),d=dr.getContext('2d');
    try{await document.fonts.load('180px Andika')}catch(e){}
    if(!dr.isConnected)return;
    const fam='px Andika, "Comic Sans MS", "Trebuchet MS", sans-serif';
    g.font=180+fam;
    const F=Math.min(180,Math.floor(180*(W-90)/g.measureText(txt).width)),BASE=Math.round(160+F*.27),k=F/180;
    const PEN=Math.max(8,12*k),WIDE=Math.max(26,36*k),FAT=Math.max(30,40*k),font=F+fam;
    g.font=font;g.textAlign='center';
    const m=c=>g.measureText(c);
    [BASE-m('H').actualBoundingBoxAscent,BASE-m('x').actualBoundingBoxAscent,BASE,BASE+m('p').actualBoundingBoxDescent]
      .forEach((y,n)=>{g.fillStyle=n===2?'#f0a39a':'#cfd9ee';g.fillRect(0,Math.round(y),W,n===2?3:2)});
    g.fillStyle='#c3cce0';g.fillText(txt,W/2,BASE);
    const off=fn=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.font=font;x.textAlign='center';x.lineCap=x.lineJoin='round';fn(x);return x.getImageData(0,0,W,H).data};
    const thin=off(x=>x.fillText(txt,W/2,BASE));
    const fat=off(x=>{x.lineWidth=FAT;x.strokeText(txt,W/2,BASE);x.fillText(txt,W/2,BASE)});
    const path=(x,w)=>{x.lineWidth=w;x.lineCap=x.lineJoin='round';x.strokeStyle='#1b2850';strokes.forEach(s=>{x.beginPath();x.moveTo(s[0][0],s[0][1]);if(s.length<2)x.lineTo(s[0][0]+.1,s[0][1]+.1);s.forEach(p=>x.lineTo(p[0],p[1]));x.stroke()})};
    const redraw=()=>{d.clearRect(0,0,W,H);path(d,PEN)};
    const pos=e=>{const r=dr.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
    dr.onpointerdown=e=>{if(done)return;e.preventDefault();try{dr.setPointerCapture(e.pointerId)}catch(_){}cur=[pos(e)];strokes.push(cur);redraw()};
    dr.onpointermove=e=>{if(!cur)return;cur.push(pos(e));redraw()};
    dr.onpointerup=dr.onpointercancel=()=>{cur=null};
    if(canSpeak)$('#hear').onclick=()=>speak(it.say);
    $('#clr').onclick=()=>{if(done)return;strokes=[];redraw();$('.fb').innerHTML=''};
    const go=()=>{i++;i<items.length?show():finish(id,score,items.length)};
    $('#chk').onclick=()=>{
      if(done)return;
      const fail=t=>{first=false;fx('no');$('.fb').innerHTML=`<p class="bad">${t}<button class="skip" id="skip">이 ${noun} 넘어가기</button></p>`;$('#skip').onclick=go};
      if(!strokes.length){$('.fb').innerHTML=`<p class="bad">먼저 흐린 ${noun} 위에 써 보세요.</p>`;return}
      const wide=off(x=>path(x,WIDE)),nar=off(x=>path(x,PEN));
      let gN=0,cov=0,uN=0,out=0;
      for(let p=3;p<thin.length;p+=16){if(thin[p]>128){gN++;if(wide[p]>128)cov++}if(nar[p]>128){uN++;if(fat[p]<128)out++}}
      if(uN&&out/uN>.4)return fail('글자 밖으로 많이 나갔어요. 지우고 다시 써 볼까요?');
      if(!gN||cov/gN<.8)return fail('아직 덜 쓴 곳이 있어요. 흐린 글자를 끝까지 따라 써 보세요.');
      done=true;if(first)score++;fx('ok');speak(it.say);
      $('.fb').innerHTML=`<p class="good">${first?'잘 썼어요!':'완성했어요!'}</p>${doneBox(txt,it.say)}<button class="next">${i+1<items.length?'다음 '+noun:'결과 보기'}</button>`;
      bindSay($('.fb'));$('.next').onclick=go;$('.next').focus();
    };
  };
  show();
}
function runMatch(id,title,u){
  const ws=pick(u.w,6),N=ws.length;let open=[],found=0,tries=0,lock=false;
  const cards=shuffle(ws.flatMap((w,k)=>[{k,en:w[0]},{k,ko:w[1],em:w[2]}]));
  app.innerHTML=shell(title,0,N,`<div class="mgrid">${cards.map((c,i)=>`<button class="mc" data-i="${i}" aria-label="카드 ${i+1}"><span class="qm">?</span><span class="face">${c.en?`<b>${c.en}</b>`:`${c.em?`<i>${c.em}</i>`:''}<span>${c.ko}</span>`}</span></button>`).join('')}</div><div class="fb" aria-live="polite"><p>카드를 두 장씩 뒤집어 영어 낱말과 뜻의 짝을 찾아요.</p></div>`);
  bindQuit();
  const els=[...app.querySelectorAll('.mc')];
  els.forEach((b,i)=>b.onclick=()=>{
    if(lock||b.classList.contains('open')||b.classList.contains('done'))return;
    b.classList.add('open');open.push(i);fx('tap');if(cards[i].en)speak(cards[i].en);
    if(open.length<2)return;
    tries++;const [a,c]=open;open=[];
    if(cards[a].k===cards[c].k){
      [a,c].forEach(x=>{els[x].classList.remove('open');els[x].classList.add('done')});found++;fx('ok');
      $('.gp').textContent=found+' / '+N;$('.prog i').style.width=found/N*100+'%';
      if(found===N)setTimeout(()=>finish(id,0,N,tries),700);
    }else{lock=true;setTimeout(()=>{[a,c].forEach(x=>els[x].classList.remove('open'));lock=false},1000)}
  });
}
function finish(id,score,total,tries){
  const n=tries?(tries<=total+2?3:tries<=total*2?2:1):(score/total>=.9?3:score/total>=.6?2:1);
  fx('win');if(n>(store[CTX.key]||0)){store[CTX.key]=n;save()}
  const line=tries?`${tries}번 만에 짝 ${total}쌍을 모두 찾았어요.`:`${total}문제 가운데 ${score}문제를 한 번에 맞혔어요.`;
  let msg='',main='',go=null;
  if(CTX.review){msg=n<2?'별 2개를 목표로 한 번 더 해 볼까요?':'이 단계의 낱말을 잘 기억하고 있어요.'}
  else if(n<2){msg='별 2개를 받으면 이 활동을 마친 거예요. 한 번 더 해 볼까요?'}
  else if(isDone(S.g,S.u)){
    const a=after(S.g,S.u);msg='이 걸음의 활동을 모두 마쳤어요!';
    if(a){main='다음 걸음: '+G[a.g].units[a.u].t;go=()=>goUnit(a.g,a.u)}else{main='과정 한눈에 보기';go=()=>{location.hash='home'}}
  }else{
    const u=unit(),nx=gamesFor(u).map(g=>gmeta(g,u)).find(g=>got(S.g,S.u,g.id)<2);
    msg='이 활동을 마쳤어요. 다음 활동으로 넘어가요.';main='다음 활동: '+nx.name;go=()=>{play(nx.id);scrollTo(0,0)};
  }
  app.innerHTML=`<div class="result"><div class="st">${stars(n)}</div><h2>${n===3?'아주 잘했어요!':n===2?'잘했어요!':'끝까지 해냈어요!'}</h2><p>${line} ${msg}</p>
  <div class="row">${main?`<button class="btn" id="main">${main}</button>`:''}<button class="btn${main?' plain':''}" id="again">다시 하기</button><button class="btn plain" id="other">${CTX.review?'단계 목록':'활동 목록'}</button></div></div>`;
  if(main){$('#main').onclick=go;$('#main').focus()}else $('#again').focus();
  $('#again').onclick=()=>CTX.again();$('#other').onclick=()=>CTX.back();
}
function route(){
  const x=location.hash.slice(1),g=[...ORDER,8,10,9].find(k=>STAGE[k].hash===x);
  if(!g){PEND=false;return viewHome()}
  S.g=g;if(PEND){PEND=false;drawTabs();viewUnit()}else viewGrade();
}
addEventListener('hashchange',route);drawSnd();route();
/* Claude 음성(tts)이 준비되면 그것으로 읽고, 없으면 브라우저 음성으로 읽는다 */
(async()=>{try{
  if(!window.claude||!window.claude.use)return;
  const t=await window.claude.use('tts');if(!t)return;
  TTS=t;canSpeak=true;drawSnd();
  if(VIEW==='unit')viewUnit();else if(VIEW==='grade')viewGrade();else if(VIEW==='home')viewHome();
}catch(e){}})();
</script>
